name: SIMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend Build ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f public/build/manifest.json && echo "✓ manifest.json exists"
          echo "Build assets:"
          ls public/build/assets/ | head -10

  # ── PHP Syntax Check ───────────────────────────────────────
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax check
        run: |
          find app database routes -name "*.php" -print0 | xargs -0 -P4 php -l | grep -v "No syntax errors" || true
          echo "✓ PHP syntax check complete"

      - name: Check for known vulnerabilities
        run: composer audit --no-dev 2>/dev/null || echo "Audit done"

  # ── Docker Build ───────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-build, php-syntax]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sims:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # Only deploy after CI passes
    needs: []   # remove this line to require ci.yml to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # To get RAILWAY_TOKEN:
        # 1. Go to railway.app → Account Settings → Tokens
        # 2. Create a token and add it to GitHub:
        #    Repo Settings → Secrets → Actions → New secret → RAILWAY_TOKEN

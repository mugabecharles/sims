name: Deploy to Railway

# Railway auto-deploys from GitHub when you connect the repo in Railway dashboard.
# This workflow only runs if you have added RAILWAY_TOKEN to GitHub Secrets.
# To add it: Railway → Account Settings → Tokens → Create token
# Then: GitHub repo → Settings → Secrets → Actions → RAILWAY_TOKEN

on:
  workflow_dispatch:  # manual trigger only — Railway handles auto-deploy itself

jobs:
  deploy:
    name: Deploy to Railway (manual)
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
